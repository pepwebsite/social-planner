<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#a855f7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Social Planner" />
    <meta name="description" content="Social Planner: clienti, calendari editoriali, approvazioni e bozze con l'AI per social media manager." />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Social Planner</title>
    <script>
      // Applica tema e visione dei colori prima del primo disegno (niente lampi)
      try {
        var p = (JSON.parse(localStorage.getItem('regia-prefs') || '{}').state) || {}
        var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (p.cvd && p.cvd !== 'none') document.documentElement.dataset.cvd = p.cvd
        // Riaperture nella stessa sessione: animazione più breve
        if (sessionStorage.getItem('sp-seen')) document.documentElement.dataset.splash = 'quick'
      } catch (e) {}
    </script>
    <style>
      /* Schermata di apertura: visibile da subito, prima che l'app sia caricata */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f7f6f3;
        color: #1c1917;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      html[data-theme='dark'] #splash {
        background: #121110;
        color: #f3efea;
      }
      #splash.out {
        opacity: 0;
        visibility: hidden;
      }
      #splash.out .sp-center {
        transform: scale(1.06);
        filter: blur(2px);
      }
      .sp-glow {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(217 70 239 / 0.24), rgb(139 92 246 / 0.12) 45%, transparent 70%);
        animation: sp-breathe 2.4s ease-in-out infinite;
      }
      .sp-center {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.55s ease, filter 0.55s ease;
      }
      .sp-logo {
        width: 104px;
        height: 104px;
        filter: drop-shadow(0 18px 30px rgb(217 70 239 / 0.35));
        animation: sp-pop 0.75s cubic-bezier(0.2, 0.9, 0.3, 1.35) both;
      }
      .sp-card {
        transform-box: view-box;
        transform-origin: 32px 40px;
        animation: sp-card 0.7s 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
      }
      .sp-heart {
        transform-box: fill-box;
        transform-origin: center;
        animation:
          sp-play 0.5s 0.75s cubic-bezier(0.2, 0.9, 0.3, 1.6) both,
          sp-beat 1.1s 1.35s ease-in-out infinite;
      }
      .sp-star {
        transform-box: fill-box;
        transform-origin: center;
        animation:
          sp-play 0.45s 1s cubic-bezier(0.2, 0.9, 0.3, 1.6) both,
          sp-twinkle 1.6s 1.5s ease-in-out infinite;
      }
      .sp-name {
        margin-top: 26px;
        display: flex;
        gap: 0.28em;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .sp-name span {
        display: inline-block;
        animation: sp-rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .sp-accent {
        background: linear-gradient(90deg, #8b5cf6, #d946ef, #fb7185);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sp-tag {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 500;
        opacity: 0.6;
        animation: sp-fade 0.6s 1.15s ease both;
      }
      .sp-bar {
        position: absolute;
        bottom: max(56px, calc(env(safe-area-inset-bottom) + 40px));
        width: 132px;
        height: 4px;
        border-radius: 99px;
        overflow: hidden;
        background: rgb(120 113 108 / 0.18);
        animation: sp-fade 0.4s 0.9s ease both;
      }
      .sp-bar i {
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: 99px;
        background: linear-gradient(90deg, #8b5cf6, #d946ef, #fb7185);
        animation: sp-load 1.1s ease-in-out infinite;
      }
      html[data-splash='quick'] #splash * {
        animation-duration: 0.35s !important;
        animation-delay: 0s !important;
      }
      html[data-splash='quick'] .sp-bar i {
        animation: sp-load 1.1s ease-in-out infinite !important;
      }
      @keyframes sp-pop {
        from {
          transform: scale(0.6) rotate(-8deg);
          opacity: 0;
        }
      }
      @keyframes sp-card {
        from {
          transform: translateY(14px) scale(0.85);
          opacity: 0;
        }
      }
      @keyframes sp-beat {
        0%,
        40%,
        100% {
          transform: scale(1);
        }
        20% {
          transform: scale(1.14);
        }
        30% {
          transform: scale(0.96);
        }
      }
      @keyframes sp-twinkle {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
        50% {
          transform: scale(0.7) rotate(45deg);
          opacity: 0.6;
        }
      }
      @keyframes sp-play {
        from {
          transform: scale(0);
          opacity: 0;
        }
      }
      @keyframes sp-rise {
        from {
          transform: translateY(16px);
          opacity: 0;
        }
      }
      @keyframes sp-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes sp-breathe {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }
      @keyframes sp-load {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(240%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-glow"></div>
      <div class="sp-center">
        <svg class="sp-logo" viewBox="0 0 64 64">
          <defs>
            <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b5cf6" />
              <stop offset=".55" stop-color="#d946ef" />
              <stop offset="1" stop-color="#fb7185" />
            </linearGradient>
            <radialGradient id="sp-hl" cx=".22" cy=".12" r=".85">
              <stop offset="0" stop-color="#fff" stop-opacity=".45" />
              <stop offset=".55" stop-color="#fff" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="sp-top" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fb7185" />
              <stop offset="1" stop-color="#fb923c" />
            </linearGradient>
            <linearGradient id="sp-heart" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f472b6" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
            <filter id="sp-sh" x="-25%" y="-25%" width="150%" height="160%">
              <feDropShadow dx="0" dy="2.4" stdDeviation="2.2" flood-color="#581c87" flood-opacity=".38" />
            </filter>
          </defs>
          <rect width="64" height="64" rx="15" fill="url(#sp-bg)" />
          <rect width="64" height="64" rx="15" fill="url(#sp-hl)" />
          <g class="sp-card">
            <g filter="url(#sp-sh)"><rect x="13" y="17" width="38" height="34" rx="9" fill="#fff" /></g>
            <rect x="13" y="17" width="38" height="11" rx="9" fill="url(#sp-top)" />
            <rect x="13" y="23" width="38" height="5" fill="url(#sp-top)" />
            <rect x="21" y="12" width="5" height="10" rx="2.5" fill="#fff" />
            <rect x="38" y="12" width="5" height="10" rx="2.5" fill="#fff" />
          </g>
          <g class="sp-heart">
            <path d="M32 47.2C24.2 42 22.6 38.4 22.6 35.9a4.7 4.7 0 0 1 9.4-1.5 4.7 4.7 0 0 1 9.4 1.5c0 2.5-1.6 6.1-9.4 11.3z" fill="url(#sp-heart)" />
            <path d="M27.4 34.6a2.2 2.2 0 0 1 2.6-1.4" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round" fill="none" />
          </g>
          <path class="sp-star" d="M52 5.5l1.6 4.2 4.2 1.6-4.2 1.6-1.6 4.2-1.6-4.2-4.2-1.6 4.2-1.6z" fill="#fde047" />
          <circle class="sp-star" cx="9.5" cy="54" r="1.6" fill="#fff" fill-opacity=".75" />
        </svg>
        <div class="sp-name">
          <span style="animation-delay: 0.7s">Social</span>
          <span class="sp-accent" style="animation-delay: 0.82s">Planner</span>
        </div>
        <div class="sp-tag">Tutti i tuoi clienti, sotto controllo</div>
      </div>
      <div class="sp-bar"><i></i></div>
    </div>
    <script>
      // Paracadute: se l'app non parte, la schermata non resta per sempre
      setTimeout(function () {
        var s = document.getElementById('splash')
        if (s) s.classList.add('out')
      }, 12000)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
