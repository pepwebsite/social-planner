<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Social Planner" />
    <meta name="description" content="Social Planner: clienti, calendari editoriali, approvazioni e bozze con l'AI per social media manager." />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Social Planner</title>
    <script>
      // Applica tema e visione dei colori prima del primo disegno (niente lampi)
      try {
        var p = (JSON.parse(localStorage.getItem('regia-prefs') || '{}').state) || {}
        var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (p.cvd && p.cvd !== 'none') document.documentElement.dataset.cvd = p.cvd
        // Riaperture nella stessa sessione: animazione più breve
        if (sessionStorage.getItem('sp-seen')) document.documentElement.dataset.splash = 'quick'
      } catch (e) {}
    </script>
    <style>
      /* Schermata di apertura: visibile da subito, prima che l'app sia caricata */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f7f6f3;
        color: #1c1917;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      html[data-theme='dark'] #splash {
        background: #121110;
        color: #f3efea;
      }
      #splash.out {
        opacity: 0;
        visibility: hidden;
      }
      #splash.out .sp-center {
        transform: scale(1.06);
        filter: blur(2px);
      }
      .sp-glow {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(139 92 246 / 0.28), rgb(99 102 241 / 0.12) 45%, transparent 70%);
        animation: sp-breathe 2.4s ease-in-out infinite;
      }
      .sp-center {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.55s ease, filter 0.55s ease;
      }
      .sp-logo {
        width: 104px;
        height: 104px;
        filter: drop-shadow(0 18px 30px rgb(99 102 241 / 0.35));
        animation: sp-pop 0.75s cubic-bezier(0.2, 0.9, 0.3, 1.35) both;
      }
      .sp-draw {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: sp-draw 0.85s 0.3s cubic-bezier(0.6, 0, 0.3, 1) forwards;
      }
      .sp-draw.late {
        animation-delay: 0.55s;
      }
      .sp-play {
        transform-box: fill-box;
        transform-origin: center;
        animation: sp-play 0.5s 1s cubic-bezier(0.2, 0.9, 0.3, 1.5) both;
      }
      .sp-name {
        margin-top: 26px;
        display: flex;
        gap: 0.28em;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .sp-name span {
        display: inline-block;
        animation: sp-rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .sp-accent {
        background: linear-gradient(90deg, #6366f1, #8b5cf6, #d946ef);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sp-tag {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 500;
        opacity: 0.6;
        animation: sp-fade 0.6s 1.15s ease both;
      }
      .sp-bar {
        position: absolute;
        bottom: max(56px, calc(env(safe-area-inset-bottom) + 40px));
        width: 132px;
        height: 4px;
        border-radius: 99px;
        overflow: hidden;
        background: rgb(120 113 108 / 0.18);
        animation: sp-fade 0.4s 0.9s ease both;
      }
      .sp-bar i {
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: 99px;
        background: linear-gradient(90deg, #6366f1, #d946ef);
        animation: sp-load 1.1s ease-in-out infinite;
      }
      html[data-splash='quick'] #splash * {
        animation-duration: 0.35s !important;
        animation-delay: 0s !important;
      }
      html[data-splash='quick'] .sp-bar i {
        animation: sp-load 1.1s ease-in-out infinite !important;
      }
      @keyframes sp-pop {
        from {
          transform: scale(0.6) rotate(-8deg);
          opacity: 0;
        }
      }
      @keyframes sp-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes sp-play {
        from {
          transform: scale(0);
          opacity: 0;
        }
      }
      @keyframes sp-rise {
        from {
          transform: translateY(16px);
          opacity: 0;
        }
      }
      @keyframes sp-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes sp-breathe {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }
      @keyframes sp-load {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(240%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
          stroke-dashoffset: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-glow"></div>
      <div class="sp-center">
        <svg class="sp-logo" viewBox="0 0 64 64">
          <defs>
            <linearGradient id="sp-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset=".55" stop-color="#8b5cf6" />
              <stop offset="1" stop-color="#d946ef" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill="url(#sp-g)" />
          <rect class="sp-draw" pathLength="100" x="15" y="18" width="34" height="31" rx="7" fill="none" stroke="#fff" stroke-width="3.6" />
          <path class="sp-draw late" pathLength="100" d="M15 27.5h34" stroke="#fff" stroke-width="3.6" />
          <path class="sp-draw late" pathLength="100" d="M24 13v8M40 13v8" stroke="#fff" stroke-width="3.6" stroke-linecap="round" />
          <path class="sp-play" d="M28.5 32.5v10.5l9-5.25z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
        <div class="sp-name">
          <span style="animation-delay: 0.7s">Social</span>
          <span class="sp-accent" style="animation-delay: 0.82s">Planner</span>
        </div>
        <div class="sp-tag">Tutti i tuoi clienti, sotto controllo</div>
      </div>
      <div class="sp-bar"><i></i></div>
    </div>
    <script>
      // Paracadute: se l'app non parte, la schermata non resta per sempre
      setTimeout(function () {
        var s = document.getElementById('splash')
        if (s) s.classList.add('out')
      }, 12000)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
